<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اطلب موقعك | أبو العز العمري</title>
<style>
:root {
    --bg-deep: #030307;
    --bg-card: #0a0b12;
    --accent-blue: #0084ff;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
body { background: var(--bg-deep); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

header {
    background: rgba(3, 3, 7, 0.85);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    padding: 20px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.logo { font-size: 20px; font-weight: 900; color: #fff; text-decoration: none; }

.container { max-width: 650px; margin: 50px auto; padding: 0 20px; width: 100%; flex: 1; }
.order-card {
    background: var(--bg-card);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
}
h1 { font-size: 26px; margin-bottom: 10px; color: #fff; text-align: center; }
p.sub { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 30px; }

.form-group { margin-bottom: 20px; }
label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #fff; }
input, textarea, select {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent-blue); }
textarea { resize: vertical; min-height: 120px; }

.submit-btn {
    background: #0084ff;
    color: #fff;
    border: none;
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0, 132, 255, 0.4);
    transition: opacity 0.2s;
    margin-top: 10px;
}
.submit-btn:hover { opacity: 0.9; }

footer { text-align: center; padding: 20px; font-size: 12px; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.03); }
</style>
</head>
<body>

<header>
    <a href="index.html" class="logo">أبو العز العمري</a>
    <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 13px;">← العودة للرئيسية</a>
</header>

<div class="container">
    <div class="order-card">
        <h1>اطلب مشروعك البرمجي</h1>
        <p class="sub">أدخل التفاصيل أدناه ليتم حفظه في سحابة الشركة وإرساله إليك</p>

        <form id="orderForm">
            <div class="form-group">
                <label>اسمك الكامل على فيسبوك:</label>
                <input type="text" id="fbName" required placeholder="مثال: أبو العز العمري">
            </div>

            <div class="form-group">
                <label>تفاصيل المشروع المطلوبة:</label>
                <textarea id="projectDetails" required placeholder="اشرح لنا فكرة موقعك أو لعبتك..."></textarea>
            </div>

            <div class="form-group">
                <label>الإضافات الخاصة:</label>
                <input type="text" id="addons" placeholder="مثال: لوحة تحكم، إعلانات...">
            </div>

            <div class="form-group">
                <label>اختر الميزانية المتوقعة:</label>
                <select id="budget">
                    <option value="ميزانية اقتصادية">ميزانية اقتصادية</option>
                    <option value="ميزانية متوسطة (احترافية)">ميزانية متوسطة (احترافية)</option>
                    <option value="ميزانية ضخمة (موقع متكامل)">ميزانية ضخمة (موقع متكامل)</option>
                </select>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">إرسال الطلب وحفظه بالسحاب 🚀</button>
        </form>
    </div>
</div>

<footer>
    جميع الحقوق محفوظة © 2026 - أبو العز العمري
</footer>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addServerTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // ضع بيانات مشروعك هنا بعد إنشائه في فايربيس
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  document.getElementById('orderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "جاري الحفظ في السحاب...";

    const name = document.getElementById('fbName').value;
    const details = document.getElementById('projectDetails').value;
    const addons = document.getElementById('addons').value || "لا توجد";
    const budget = document.getElementById('budget').value;
    const date = new Date().toLocaleString('ar-SA');

    try {
      // حفظ في قاعدة البيانات السحابية (Firestore)
      await addDoc(collection(db, "orders"), {
        name, details, addons, budget, date
      });

      alert('تم حفظ طلبك بنجاح في قاعدة بيانات الشركة السحابية!');

      // تحويل لمسنجر
      const message = `مرحباً أبو العز، أريد طلب مشروع:%0a- الاسم: ${name}%0a- التفاصيل: ${details}%0a- الإضافات: ${addons}%0a- الميزانية: ${budget}`;
      window.location.href = `https://m.me/61550351005838?text=${encodeURIComponent(message)}`;
    } catch (error) {
      alert('حدث خطأ بالاتصال بالسحاب. تأكد من إعدادات المفتاح.');
      btn.disabled = false;
      btn.innerText = "إرسال الطلب وحفظه بالسحاب 🚀";
    }
  });
</script>

</body>
</html>
