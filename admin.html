<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة المشرف | أبو العز العمري</title>
<style>
:root {
    --bg-deep: #030307;
    --bg-card: #0a0b12;
    --accent-blue: #0084ff;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
body { background: var(--bg-deep); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

.login-box, .admin-panel {
    background: var(--bg-card);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 30px;
    width: 100%;
    max-width: 750px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
}
.login-box { max-width: 420px; text-align: center; }
h2 { margin-bottom: 20px; color: #fff; }
input, textarea {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    margin-bottom: 15px;
    outline: none;
}
.login-box input { text-align: center; }
.btn {
    background: var(--accent-blue);
    color: #fff;
    border: none;
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(0, 132, 255, 0.3);
}
.error { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }

.admin-panel { display: none; text-align: right; }
.section-box { background: rgba(255,255,255,0.02); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05); }
.order-item { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 10px; border-right: 4px solid var(--accent-blue); }
.order-item p { font-size: 13px; color: var(--text-muted); margin-top: 5px; }
.delete-btn { background: #ef4444; color: #fff; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; margin-top: 8px; }
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div class="login-box" id="loginBox">
    <h2>🔐 بوابة إدارة أبو العز السحابية</h2>
    <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">أدخل كلمة المرور السرية للوصول</p>
    <input type="password" id="adminPass" placeholder="كلمة المرور...">
    <button class="btn" onclick="checkPassword()">دخول النظام</button>
    <div class="error" id="errorMsg">❌ كلمة المرور غير صحيحة!</div>
</div>

<!-- لوحة التحكم المحمية -->
<div class="admin-panel" id="adminPanel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>🛡️ لوحة تحكم شركة أبو العز السحابية</h2>
        <button class="btn" style="width: auto; padding: 8px 15px; background: #ef4444; font-size: 12px;" onclick="logout()">خروج</button>
    </div>
    
    <!-- صندوق إضافة مشروع جديد لمعرض أعمال الشركة -->
    <div class="section-box">
        <h3 style="font-size: 16px; color: #fff; margin-bottom: 12px;">➕ إضافة موقع أو مشروع جديد للسحاب</h3>
        <input type="text" id="projTitle" placeholder="اسم المشروع...">
        <textarea id="projDesc" placeholder="وصف موجز للمشروع..." style="min-height: 70px;"></textarea>
        <input type="text" id="projLink" placeholder="رابط المشروع (https://...)">
        <button class="btn" onclick="addNewProject()">نشر المشروع في الموقع الرئيسي</button>
    </div>

    <!-- صندوق رسائل وطلبات الزبائن السحابية -->
    <div class="section-box">
        <h3 style="font-size: 16px; color: #fff; margin-bottom: 12px;">📥 طلبات الزبائن الواردة (من السحاب)</h3>
        <div id="ordersList">
            <p style="color: var(--text-muted); font-size: 13px;">جاري تحميل الطلبات...</p>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // ضع بيانات مشروعك هنا بعد إنشائه في فايربيس
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // حماية بكلمة المرور
  window.checkPassword = function() {
    const pass = document.getElementById('adminPass').value;
    if (pass === "ابو العز 2012") {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        fetchCloudOrders();
    } else {
        document.getElementById('errorMsg').style.display = 'block';
    }
  }

  window.logout = function() {
    document.getElementById('adminPass').value = '';
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('errorMsg').style.display = 'none';
  }

  // جلب الطلبات من قاعدة البيانات
  async function fetchCloudOrders() {
    const ordersContainer = document.getElementById('ordersList');
    try {
        const querySnapshot = await getDocs(collection(db, "orders"));
        if (querySnapshot.empty) {
            ordersContainer.innerHTML = `<p style="color: var(--text-muted); font-size: 13px;">لا توجد طلبات جديدة حالياً.</p>`;
            return;
        }
        ordersContainer.innerHTML = '';
        querySnapshot.forEach((documentSnapshot) => {
            const ord = documentSnapshot.data();
            const docId = documentSnapshot.id;
            ordersContainer.innerHTML += `
                <div class="order-item">
                    <strong style="color: #fff;">👤 الاسم: ${ord.name}</strong>
                    <p>📝 <b>التفاصيل:</b> ${ord.details}</p>
                    <p>⚡ <b>الإضافات:</b> ${ord.addons} | 💰 <b>الميزانية:</b> ${ord.budget}</p>
                    <p style="font-size: 11px; opacity: 0.6;">⏰ ${ord.date}</p>
                    <button class="delete-btn" onclick="deleteOrder('${docId}')">حذف الطلب</button>
                </div>
            `;
        });
    } catch (e) {
        ordersContainer.innerHTML = `<p style="color: #ef4444; font-size: 13px;">خطأ في الاتصال بقاعدة البيانات السحابية.</p>`;
    }
  }

  // إضافة مشروع جديد للسحاب
  window.addNewProject = async function() {
    const title = document.getElementById('projTitle').value;
    const desc = document.getElementById('projDesc').value;
    const link = document.getElementById('projLink').value;

    if (!title || !desc || !link) {
        alert('الرجاء تعبئة كافة حقول المشروع!');
        return;
    }

    try {
        await addDoc(collection(db, "projects"), { title, desc, link });
        alert('تم نشر المشروع في السحاب وعرضه في الموقع الرئيسي بنجاح!');
        document.getElementById('projTitle').value = '';
        document.getElementById('projDesc').value = '';
        document.getElementById('projLink').value = '';
    } catch (e) {
        alert('فشل في نشر المشروع.');
    }
  }

  // حذف طلب من السحاب
  window.deleteOrder = async function(docId) {
    if (confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
        try {
            await deleteDoc(doc(db, "orders", docId));
            fetchCloudOrders();
        } catch (e) {
            alert('فشل في الحذف.');
        }
    }
  }
</script>

</body>
</html>
